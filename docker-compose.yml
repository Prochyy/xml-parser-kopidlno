version: '3.8'

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: ulohaTrixi-postgres
    environment:
      POSTGRES_DB: ulohaTrixi_db
      POSTGRES_USER: ulohaTrixi_user
      POSTGRES_PASSWORD: ${DB_HESLO}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: